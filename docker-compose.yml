services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: foro
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpw
    restart: unless-stopped
    volumes:
      - ./internal/db/schema/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - posdata:/var/lib/postgresql

  webserver:
    image: golang:latest
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    command: go run ./cmd/server/main.go
    depends_on:
      - db

volumes:
  posdata: