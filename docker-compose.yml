services:
  db:
    image: postgres:latest
    env_file: .env # POSTGRES_USER, POSTGRES_PASSWORD y POSTGRES_DB (ver .env.example)
    restart: unless-stopped
    volumes:
      - ./internal/db/schema/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - posdata:/var/lib/postgresql

  webserver:
    image: golang:latest
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    command: go run ./cmd/server/main.go
    env_file: .env # el servidor arma la conexion a la base con estas mismas variables
    depends_on:
      - db

volumes:
  posdata: